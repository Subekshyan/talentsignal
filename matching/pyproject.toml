[project]
name = "talentsignal-matching"
version = "0.1.0"
description = "Explainable CV-to-job-description matching engine"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["talentsignal_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
