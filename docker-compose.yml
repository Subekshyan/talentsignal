services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: talentsignal
      POSTGRES_PASSWORD: talentsignal   # dev only: change for any real deployment
      POSTGRES_DB: talentsignal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://talentsignal:talentsignal@db:5432/talentsignal
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
